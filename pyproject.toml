[project]
name = "alarmhomeserver"
version = "0.1.0"
description = "Open-source home server for Yale/Climax alarms"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = [
    "fastapi==0.115.6",
    "starlette==0.41.3",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",
]

[tool.setuptools.packages.find]
include = ["alarmhomeserver*"]
